name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: 8.5.8
          coverage: none
          tools: composer:2.10.1
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer audit
      - run: composer lint:check
      - run: composer analyse -- --error-format=github
      - run: composer test
      - run: composer consumer:check
      - run: bash -n .agents/setup .agents/resume scripts/test-consumer-install.sh
